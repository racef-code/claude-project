<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On - MVP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/playground.css') }}">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav class="nav-bar">
                <div class="nav-brand">
                    <h1>Virtual Try-On</h1>
                    <p>See yourself in our collection</p>
                </div>
                <div class="nav-links">
                    <a href="/" class="nav-link active">Virtual Try-On</a>
                    <a href="/playground" class="nav-link">Playground</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Catalog Grid -->
        <div id="catalog" class="catalog-grid">
            <!-- Catalog items will be loaded here by JavaScript -->
        </div>
    </main>

    <!-- Try-On Modal -->
    <div id="tryOnModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>

            <div id="modalStep1" class="modal-step active">
                <h2>Upload Your Photo</h2>
                <p class="selected-item">Selected: <span id="selectedItemName"></span></p>

                <!-- Upload Area -->
                <div id="uploadArea" class="upload-area">
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <div class="upload-placeholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Click to upload or drag and drop</p>
                        <p class="hint">JPG, PNG up to 10MB</p>
                    </div>
                    <img id="uploadPreview" class="upload-preview" style="display: none;">
                </div>

                <button id="generateBtn" class="btn btn-primary" style="display: none;">Generate Try-On</button>
            </div>

            <!-- Loading State -->
            <div id="modalLoading" class="modal-step">
                <div class="loading-spinner"></div>
                <p>Generating your try-on image...</p>
                <p class="hint">This may take 10-20 seconds</p>
            </div>

            <!-- Results -->
            <div id="modalResults" class="modal-step">
                <h2>Your Virtual Try-On</h2>
                <div class="results-container">
                    <div class="result-image">
                        <h3>Original</h3>
                        <img id="originalImage" alt="Original photo">
                    </div>
                    <div class="result-image">
                        <h3>Try-On Result</h3>
                        <img id="generatedImage" alt="Generated try-on">
                    </div>
                </div>
                <div class="result-actions">
                    <button id="tryAnotherBtn" class="btn btn-secondary">Try Another Item</button>
                    <button id="closeResultsBtn" class="btn btn-primary">Close</button>
                </div>
            </div>

            <!-- Error State -->
            <div id="modalError" class="modal-step">
                <div class="error-message">
                    <h2>Oops!</h2>
                    <p id="errorText"></p>
                    <button id="retryBtn" class="btn btn-primary">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
